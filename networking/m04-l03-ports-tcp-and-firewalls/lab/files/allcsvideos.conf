# web-01: the storefront (static files) on port 80. /login stands in for the API's login endpoint:
# every attempt in this lab is rejected with 401, like a wrong password.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/allcsvideos;
    index index.html;
    location = /login { return 401 "wrong username or password\n"; }
    location / { try_files $uri $uri/ =404; }
}
