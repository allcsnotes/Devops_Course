log_format timing '$remote_addr "$request" $status rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name allcsvideos.test www.allcsvideos.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name allcsvideos.test www.allcsvideos.test;
    ssl_certificate     /etc/nginx/tls/allcsvideos.crt;
    ssl_certificate_key /etc/nginx/tls/allcsvideos.key;
    access_log /var/log/nginx/access.log timing;

    location /api/ {
        proxy_pass http://10.0.56.30:8080;
        proxy_read_timeout 5s;
    }
    location / {
        proxy_pass http://10.0.56.20:8080;
    }
}
