upstream storefront { server 10.0.44.11:3000; }
upstream api        { server 10.0.44.21:8080; }

server {
    listen 80;
    server_name www.allcsvideos.test allcsvideos.test;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.allcsvideos.test allcsvideos.test;

    ssl_certificate     /etc/letsencrypt/live/www.allcsvideos.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.allcsvideos.test/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=300" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://storefront;
    }
    location /api/ {
        proxy_pass http://api;
    }
}
