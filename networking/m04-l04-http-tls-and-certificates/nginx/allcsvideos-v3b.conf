upstream storefront { server 10.0.44.11:3000; }
upstream api        { server 10.0.44.21:8080; }

server {
    listen 80;
    server_name www.allcsvideos.test;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://storefront;
    }
    location /api/ {
        proxy_pass http://api;
    }
}

server {
    listen 443 ssl http2;
    server_name www.allcsvideos.test allcsvideos.test;

    ssl_certificate     /etc/nginx/tls/fullchain.crt;
    ssl_certificate_key /etc/nginx/tls/www.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://storefront;
    }
    location /api/ {
        proxy_pass http://api;
    }
}
