# Lesson 6 routing: severity=page wakes a human (the lab receiver stands in for a pager), the rest goes to tickets.
route:
  receiver: tickets
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    - matchers: [severity="page"]
      receiver: pager
receivers:
  - name: pager
    webhook_configs: [{url: "http://receiver:8080/page", send_resolved: true}]
  - name: tickets
    webhook_configs: [{url: "http://receiver:8080/ticket", send_resolved: true}]
