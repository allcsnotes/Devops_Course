global:
  scrape_interval: 5s          # lab: fast, so the demo reacts in seconds
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]
scrape_configs:
  - job_name: allcsvideos
    static_configs:
      - {targets: ["api-1:8080", "api-2:8080"], labels: {service: catalog-api}}
      - {targets: ["bff-1:8080", "bff-2:8080"], labels: {service: storefront-bff}}
      - {targets: ["copilot:8080"], labels: {service: course-copilot}}
