# Gitea runner (gitea/runner:5.1.1) config for the M19-L01 lab (same as the Module 8 lab; the full option list:
# gitea-runner config generate). Only the options we change.
log:
  level: info
runner:
  file: /data/.runner
  capacity: 3
  labels:
    - "ubuntu-latest:docker://gitea/runner-images:ubuntu-24.04-v26.10.01"
cache:
  enabled: true                # the runner's built-in cache server (actions/cache talks to it)
  dir: /data/cache             # cache blobs live in the runner's data volume
  port: 8088
container:
  network: idp-net             # job containers join the lab network, so they reach http://gitea:3000
  options: --label course=devops --label lab=idp
  docker_host: "-"             # the runner never hands your laptop's Docker socket to a job
