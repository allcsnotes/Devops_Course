# Grafana 13.2.4 (lab): anonymous viewer access, a provisioned Prometheus data source and the allcsvideos cost dashboard
# GENERATED by grafana/make_dash.py (python3 grafana/make_dash.py rewrites this file)
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning, namespace: monitoring}
data:
  datasources.yaml: |
    {
      "apiVersion": 1,
      "datasources": [
        {
          "name": "Prometheus",
          "uid": "prom",
          "type": "prometheus",
          "access": "proxy",
          "url": "http://prometheus.monitoring:9090",
          "isDefault": true,
          "jsonData": {
            "timeInterval": "15s"
          }
        }
      ]
    }
  dashboards.yaml: |
    {
      "apiVersion": 1,
      "providers": [
        {
          "name": "finops",
          "folder": "FinOps",
          "type": "file",
          "options": {
            "path": "/var/lib/grafana/dashboards"
          }
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboards, namespace: monitoring}
data:
  allcs-cost.json: |
    {
      "uid": "allcs-cost",
      "title": "allcsvideos cost",
      "tags": [
        "finops",
        "opencost"
      ],
      "timezone": "browser",
      "schemaVersion": 41,
      "refresh": "1m",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Cluster cost per hour (node price)",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "sum(node_total_hourly_cost)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 4,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Cluster cost per month (x 730 h)",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "sum(node_total_hourly_cost) * 730"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "allcsvideos allocated per hour",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "sum((sum by (namespace) (container_cpu_allocation{namespace=~\"allcs-.*\"} * on (node) group_left() avg by (node) (node_cpu_hourly_cost))) + (sum by (namespace) (container_memory_allocation_bytes{namespace=~\"allcs-.*\"} / 1024 / 1024 / 1024 * on (node) group_left() avg by (node) (node_ram_hourly_cost))))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 4,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Idle share of the node",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "1 - sum((sum by (namespace) (container_cpu_allocation{namespace=~\"allcs-.*\"} * on (node) group_left() avg by (node) (node_cpu_hourly_cost))) + (sum by (namespace) (container_memory_allocation_bytes{namespace=~\"allcs-.*\"} / 1024 / 1024 / 1024 * on (node) group_left() avg by (node) (node_ram_hourly_cost)))) / sum(node_total_hourly_cost)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Cost per hour by namespace (allocated = max of request and usage)",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "(sum by (namespace) (container_cpu_allocation{namespace=~\"allcs-.*\"} * on (node) group_left() avg by (node) (node_cpu_hourly_cost))) + (sum by (namespace) (container_memory_allocation_bytes{namespace=~\"allcs-.*\"} / 1024 / 1024 / 1024 * on (node) group_left() avg by (node) (node_ram_hourly_cost)))",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "decimals": 4
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Cost per hour by team label",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "sum by (label_team) ((container_cpu_allocation{namespace=~\"allcs-.*\"} * on (node) group_left() avg by (node) (node_cpu_hourly_cost) + container_memory_allocation_bytes{namespace=~\"allcs-.*\"} / 1073741824 * on (node) group_left() avg by (node) (node_ram_hourly_cost)) * on (namespace, pod) group_left (label_team) max by (namespace, pod, label_team) (kube_pod_labels))",
              "legendFormat": "{{label_team}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "decimals": 4
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU requested vs used (cores)",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "sum by (namespace) (kube_pod_container_resource_requests{resource=\"cpu\", namespace=~\"allcs-.*\"})",
              "legendFormat": "{{namespace}} requested"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\", namespace=~\"allcs-.*\"}[5m]))",
              "legendFormat": "{{namespace}} used"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: monitoring, labels: {app: grafana}}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:13.2.4
        env:
        - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}      # lab only
        - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
        - {name: GF_SECURITY_ADMIN_PASSWORD, value: demo-password-123}   # FAKE lab password
        - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
        - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
        - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
        ports: [{containerPort: 3000}]
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 768Mi}
        volumeMounts:
        - {name: prov, mountPath: /etc/grafana/provisioning/datasources/ds.yaml, subPath: datasources.yaml}
        - {name: prov, mountPath: /etc/grafana/provisioning/dashboards/db.yaml, subPath: dashboards.yaml}
        - {name: dash, mountPath: /var/lib/grafana/dashboards}
      volumes:
      - {name: prov, configMap: {name: grafana-provisioning}}
      - {name: dash, configMap: {name: grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: monitoring}
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
