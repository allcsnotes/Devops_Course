# allcsvideos dev: every service copied the same template requests (500m CPU, 384Mi memory)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: allcs-dev
  labels: {app: api, project: allcsvideos, env: dev, team: courses, cost-center: cc-1042}
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api, project: allcsvideos, env: dev, team: courses, cost-center: cc-1042}
    spec:
      containers:
      - name: api
        image: allcsvideos-api:1.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 500m
            memory: 384Mi
          limits:
            memory: 384Mi
        readinessProbe:
          httpGet: {path: /readyz, port: 8080}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: allcs-dev
spec:
  selector: {app: api}
  ports:
  - port: 80
    targetPort: 8080
