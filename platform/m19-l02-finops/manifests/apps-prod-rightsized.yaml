# allcsvideos prod: requests rightsized from 30 minutes of real usage (rightsize.sh)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: allcs-prod
  labels: {app: api, project: allcsvideos, env: prod, team: courses, cost-center: cc-1042}
spec:
  replicas: 3
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api, project: allcsvideos, env: prod, team: courses, cost-center: cc-1042}
    spec:
      containers:
      - name: api
        image: allcsvideos-api:1.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 400m
            memory: 64Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet: {path: /readyz, port: 8080}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: allcs-prod
spec:
  selector: {app: api}
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: allcs-prod
  labels: {app: catalog, project: allcsvideos, env: prod, team: courses, cost-center: cc-1042}
spec:
  replicas: 2
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog, project: allcsvideos, env: prod, team: courses, cost-center: cc-1042}
    spec:
      containers:
      - name: catalog
        image: allcsvideos-api:1.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 60m
            memory: 64Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet: {path: /readyz, port: 8080}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: allcs-prod
spec:
  selector: {app: catalog}
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: allcs-prod
  labels: {app: storefront, project: allcsvideos, env: prod, team: web, cost-center: cc-2077}
spec:
  replicas: 2
  selector:
    matchLabels: {app: storefront}
  template:
    metadata:
      labels: {app: storefront, project: allcsvideos, env: prod, team: web, cost-center: cc-2077}
    spec:
      containers:
      - name: storefront
        image: nginxinc/nginx-unprivileged:1.29.8-alpine
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: allcs-prod
spec:
  selector: {app: storefront}
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot
  namespace: allcs-prod
  labels: {app: copilot, project: allcsvideos, env: prod, team: ai, cost-center: cc-3101}
spec:
  replicas: 1
  selector:
    matchLabels: {app: copilot}
  template:
    metadata:
      labels: {app: copilot, project: allcsvideos, env: prod, team: ai, cost-center: cc-3101}
    spec:
      containers:
      - name: copilot
        image: allcsvideos-api:1.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 130m
            memory: 64Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet: {path: /readyz, port: 8080}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: copilot
  namespace: allcs-prod
spec:
  selector: {app: copilot}
  ports:
  - port: 80
    targetPort: 8080
