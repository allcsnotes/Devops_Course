apiVersion: v1
kind: Namespace
metadata:
  name: allcsvideos
---
# Sandbox policy: every pod <= 256m CPU and 512Mi memory
apiVersion: v1
kind: LimitRange
metadata:
  name: pod-defaults
  namespace: allcsvideos
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { cpu: 200m, memory: 256Mi }
      max: { cpu: 250m, memory: 512Mi }
