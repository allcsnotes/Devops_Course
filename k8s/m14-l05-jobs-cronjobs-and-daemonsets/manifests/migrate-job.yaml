apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: allcsvideos
  labels: {app: migrate, course: devops}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels: {app: migrate, course: devops}
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: busybox:1.37.0
        command: ["sh", "-c", "echo applying migration 0042_add_lesson_tags; sleep 3; echo done"]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 32Mi}
