apiVersion: batch/v1
kind: Job
metadata:
  name: thumbs
  namespace: allcsvideos
  labels: {app: thumbs, course: devops}
spec:
  completions: 6
  parallelism: 3
  completionMode: Indexed
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app: thumbs, course: devops}
    spec:
      restartPolicy: Never
      containers:
      - name: thumb
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - |
          LESSON=$((JOB_COMPLETION_INDEX + 1))
          echo "$(date +%T) index $JOB_COMPLETION_INDEX: thumbnail for lesson $LESSON"
          sleep $((8 + JOB_COMPLETION_INDEX * 2))
          echo "$(date +%T) lesson-$LESSON.jpg done"
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 32Mi}
