# only on nodes labelled for transcoding (e.g. the ones with a GPU)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: transcode-agent
  namespace: allcsvideos
  labels: {app: transcode-agent, course: devops}
spec:
  selector:
    matchLabels: {app: transcode-agent}
  template:
    metadata:
      labels: {app: transcode-agent, course: devops}
    spec:
      nodeSelector:
        allcsvideos.com/transcode: "true"
      containers:
      - name: agent
        image: busybox:1.37.0
        command: ["sh", "-c", "echo ready for transcode work; sleep 86400"]
        resources:
          requests: {cpu: 5m, memory: 8Mi}
          limits: {cpu: 50m, memory: 32Mi}
