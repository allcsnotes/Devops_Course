# a "transcode" that takes 90 seconds, scheduled every minute: it always overruns
apiVersion: batch/v1
kind: CronJob
metadata:
  name: transcode-forbid
  namespace: allcsvideos
  labels: {app: transcode-forbid, course: devops}
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 10
  jobTemplate:
    spec:
      template:
        metadata:
          labels: {app: transcode-forbid, course: devops}
        spec:
          restartPolicy: Never
          containers:
          - name: transcode
            image: busybox:1.37.0
            command: ["sh", "-c", "echo $(date +%T) start; sleep 90; echo $(date +%T) done"]
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {memory: 32Mi}
