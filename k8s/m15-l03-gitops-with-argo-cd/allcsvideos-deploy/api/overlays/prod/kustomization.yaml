apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: allcsvideos-prod
resources:
- ../../base
images:
- name: allcsvideos/api
  newTag: 1.4.0
replicas:
- name: api
  count: 2
configMapGenerator:
- name: api-config
  behavior: merge
  literals:
  - APP_ENV=prod
  - LOG_LEVEL=WARNING
