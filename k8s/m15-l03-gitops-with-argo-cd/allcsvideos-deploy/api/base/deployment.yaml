apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: allcsvideos/api:1.4.0
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: api-config
        readinessProbe:
          tcpSocket:
            port: 8080
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 96Mi
