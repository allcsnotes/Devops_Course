# Argo CD v3.5.6, installed from the official manifest (manifests/install.yaml at tag v3.5.6),
# with lab-only patches. Apply: kubectl apply -k argocd/ --server-side --force-conflicts
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
- namespace.yaml
- https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
patches:
# no single sign-on (Dex) and no notifications in this lab: fewer pods on a busy laptop
- target: {kind: Deployment, name: argocd-dex-server}
  patch: |-
    - {op: replace, path: /spec/replicas, value: 0}
- target: {kind: Deployment, name: argocd-notifications-controller}
  patch: |-
    - {op: replace, path: /spec/replicas, value: 0}
# the web UI on node port 30093 (kind maps it to 127.0.0.1:8093 on the laptop)
- target: {kind: Service, name: argocd-server}
  patch: |-
    - {op: replace, path: /spec/type, value: NodePort}
    - {op: add, path: /spec/ports/1/nodePort, value: 30093}
# slower health probes: on a laptop shared with other labs, a 1 s probe timeout restarts healthy pods
- target: {kind: Deployment, name: argocd-server}
  patch: |-
    - {op: replace, path: /spec/template/spec/containers/0/livenessProbe/timeoutSeconds, value: 10}
    - {op: replace, path: /spec/template/spec/containers/0/livenessProbe/failureThreshold, value: 6}
    - {op: replace, path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds, value: 10}
- target: {kind: Deployment, name: argocd-repo-server}
  patch: |-
    - {op: replace, path: /spec/template/spec/containers/0/livenessProbe/timeoutSeconds, value: 10}
    - {op: replace, path: /spec/template/spec/containers/0/livenessProbe/failureThreshold, value: 6}
    - {op: replace, path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds, value: 10}
