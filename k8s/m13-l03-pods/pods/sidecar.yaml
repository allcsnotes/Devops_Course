apiVersion: v1
kind: Pod
metadata:
  name: storefront
  labels:
    app: storefront
    course: devops
spec:
  volumes:
  - name: logs
    emptyDir: {}
  initContainers:
  - name: log-shipper
    image: busybox:1.37.0
    restartPolicy: Always
    command: ["tail", "-F", "/logs/access.log"]
    volumeMounts:
    - name: logs
      mountPath: /logs
  containers:
  - name: web
    image: nginx:1.29.8-alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: logs
      mountPath: /var/log/nginx
