apiVersion: v1
kind: Pod
metadata:
  name: web
  labels:
    app: storefront
    course: devops
spec:
  containers:
  - name: web
    image: nginx:1.29.8-alpine
    ports:
    - containerPort: 80
    env:
    - name: SITE_NAME
      value: allcsvideos
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 128Mi
