apiVersion: v1
kind: Pod
metadata:
  name: shared
  labels:
    course: devops
spec:
  volumes:
  - name: data
    emptyDir: {}
  containers:
  - name: writer
    image: busybox:1.37.0
    command: ["sh", "-c", "while true; do date +%T >> /data/out.log; sleep 5; done"]
    volumeMounts:
    - name: data
      mountPath: /data
  - name: reader
    image: busybox:1.37.0
    command: ["tail", "-F", "/input/out.log"]
    volumeMounts:
    - name: data
      mountPath: /input
