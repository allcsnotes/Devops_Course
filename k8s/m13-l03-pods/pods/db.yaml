apiVersion: v1
kind: Pod
metadata:
  name: db
  labels:
    app: db
    course: devops
spec:
  containers:
  - name: postgres
    image: postgres:18.6-alpine3.24
    env:
    - name: POSTGRES_PASSWORD
      value: demo-password-123   # fake, lab only
    ports:
    - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    course: devops
spec:
  selector:
    app: db
  ports:
  - port: 5432
