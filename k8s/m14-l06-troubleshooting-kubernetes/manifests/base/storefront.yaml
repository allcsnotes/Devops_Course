apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-nginx
  labels: {app: storefront, course: devops}
data:
  default.conf: |
    server {
      listen 80;
      location /api/ { proxy_pass http://api/; }
      location / { default_type text/html; return 200 "<h1>allcsvideos</h1>\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels: {app: storefront, course: devops}
spec:
  replicas: 2
  selector:
    matchLabels: {app: storefront}
  template:
    metadata:
      labels: {app: storefront, course: devops}
    spec:
      containers:
      - name: web
        image: nginx:1.29.8-alpine
        ports:
        - {name: http, containerPort: 80}
        volumeMounts:
        - {name: conf, mountPath: /etc/nginx/conf.d}
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {memory: 64Mi}
      volumes:
      - name: conf
        configMap: {name: storefront-nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  labels: {app: storefront, course: devops}
spec:
  selector: {app: storefront}
  ports:
  - {name: http, port: 80, targetPort: http}
