# the fix: the storefront may reach the API on 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  labels: {course: devops}
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {app: admin}
    - podSelector:
        matchLabels: {app: storefront}
    ports:
    - {port: 8080}
