# staged: the readiness probe checks a port nothing listens on
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels: {app: catalog, course: devops}
spec:
  replicas: 2
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog, course: devops}
    spec:
      containers:
      - name: catalog
        image: catalog-api:2.5.0
        ports:
        - {name: http, containerPort: 8080}
        envFrom:
        - configMapRef: {name: api-config}
        readinessProbe:
          httpGet: {path: /healthz, port: 8081}
          periodSeconds: 5
        resources:
          requests: {cpu: 10m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  labels: {app: catalog, course: devops}
spec:
  selector: {app: catalog}
  ports:
  - {name: http, port: 80, targetPort: http}
