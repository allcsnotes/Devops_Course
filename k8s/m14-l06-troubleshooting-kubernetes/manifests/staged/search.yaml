# staged: the Service selects app=search-api, the pods are labelled app=search
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  labels: {app: search, course: devops}
spec:
  replicas: 2
  selector:
    matchLabels: {app: search}
  template:
    metadata:
      labels: {app: search, course: devops}
    spec:
      containers:
      - name: search
        image: catalog-api:2.5.0
        ports:
        - {name: http, containerPort: 8080}
        envFrom:
        - configMapRef: {name: api-config}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 5
        resources:
          requests: {cpu: 10m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: search
  labels: {app: search, course: devops}
spec:
  selector: {app: search-api}
  ports:
  - {name: http, port: 80, targetPort: http}
