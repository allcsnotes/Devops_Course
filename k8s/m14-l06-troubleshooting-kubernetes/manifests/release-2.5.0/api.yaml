apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api, course: devops}
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api, course: devops}
    spec:
      containers:
      - name: api
        image: catalog-api:2.5.0
        ports:
        - {name: http, containerPort: 8080}
        envFrom:
        - configMapRef: {name: api-config}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app: api, course: devops}
spec:
  selector: {app: api}
  ports:
  - {name: http, port: 80, targetPort: http}
