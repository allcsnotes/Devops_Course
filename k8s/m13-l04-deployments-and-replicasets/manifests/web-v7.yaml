apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
  annotations:
    kubernetes.io/change-cause: "1.0.0 with Recreate (staged downtime demo)"
spec:
  replicas: 6
  minReadySeconds: 5
  progressDeadlineSeconds: 30
  revisionHistoryLimit: 4
  selector:
    matchLabels:
      app: web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: web:1.0.0
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 8080
          periodSeconds: 2
