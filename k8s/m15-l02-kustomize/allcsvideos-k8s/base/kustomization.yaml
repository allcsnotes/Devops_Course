apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- api.yaml
- storefront.yaml
- ingress.yaml
labels:
- pairs:
    app.kubernetes.io/part-of: allcsvideos
    course: devops
  includeTemplates: true
commonAnnotations:
  allcsvideos.com/owner: platform-team
configMapGenerator:
- name: api-config
  literals:
  - APP_ENV=base
  - LOG_LEVEL=INFO
  - DB_HOST=postgres
  - DB_USER=api
secretGenerator:
- name: db-creds
  literals:
  - password=demo-password-123   # FAKE demo value, for the lab only
