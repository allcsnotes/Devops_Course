apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: allcsvideos-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: allcsvideos/api:1.4.0
        env:
        - name: APP_ENV
          value: dev
