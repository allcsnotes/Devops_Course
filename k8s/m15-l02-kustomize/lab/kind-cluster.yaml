# kind-cluster.yaml: ONE node, the control plane, no host port mappings. kind removes the control-plane taint when
# there are no workers, so the apps run on it. Longer leader-election timings (from M14-L06) keep it stable on a busy laptop.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
kubeadmConfigPatches:
- |
  kind: ClusterConfiguration
  controllerManager:
    extraArgs:
    - {name: leader-elect-lease-duration, value: "90s"}
    - {name: leader-elect-renew-deadline, value: "60s"}
    - {name: leader-elect-retry-period, value: "10s"}
  scheduler:
    extraArgs:
    - {name: leader-elect-lease-duration, value: "90s"}
    - {name: leader-elect-renew-deadline, value: "60s"}
    - {name: leader-elect-retry-period, value: "10s"}
nodes:
- role: control-plane
