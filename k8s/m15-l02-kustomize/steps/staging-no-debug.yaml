apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: allcsvideos-staging
resources:
- ../../base
images:
- name: allcsvideos/api
  newTag: 1.5.0
- name: allcsvideos/storefront
  newTag: 1.5.0
replicas:
- name: api
  count: 2
- name: storefront
  count: 2
configMapGenerator:
- name: api-config
  behavior: merge
  literals:
  - APP_ENV=staging
patches:
- target:
    kind: Ingress
    name: web
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: staging.allcsvideos.com
replacements:
- source:
    kind: Ingress
    name: web
    fieldPath: spec.rules.0.host
  targets:
  - select:
      kind: Deployment
      name: api
    fieldPaths:
    - spec.template.spec.containers.[name=api].env.[name=PUBLIC_HOST].value
labels:
- pairs:
    environment: staging
  includeSelectors: false
  includeTemplates: true
