# Pebble 2.10.1: Let's Encrypt's own ACME test server, running in the cluster (lab only)
apiVersion: v1
kind: Namespace
metadata:
  name: pebble
---
# Pebble's own HTTPS certificate, from the lab CA
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pebble-tls
  namespace: pebble
spec:
  secretName: pebble-tls
  dnsNames: [pebble.pebble.svc]
  issuerRef: {name: lab-ca, kind: ClusterIssuer}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pebble-config
  namespace: pebble
data:
  pebble.json: |
    {"pebble": {"listenAddress": "0.0.0.0:14000", "managementListenAddress": "0.0.0.0:15000",
      "certificate": "/tls/tls.crt", "privateKey": "/tls/tls.key",
      "httpPort": 80, "tlsPort": 443, "ocspResponderURL": "", "externalAccountBindingRequired": false,
      "keyAlgorithm": "ecdsa",
      "profiles": {"default": {"description": "90 days", "validityPeriod": 7776000}}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pebble
  namespace: pebble
spec:
  selector:
    matchLabels: {app: pebble}
  template:
    metadata:
      labels: {app: pebble}
    spec:
      containers:
      - name: pebble
        image: ghcr.io/letsencrypt/pebble:2.10.1
        args: ["-config", "/config/pebble.json", "-dnsserver", "10.96.0.10:53"]   # the cluster DNS
        env:
        - {name: PEBBLE_VA_NOSLEEP, value: "1"}
        - {name: PEBBLE_WFE_NONCEREJECT, value: "0"}
        ports:
        - {name: acme, containerPort: 14000}
        volumeMounts:
        - {name: config, mountPath: /config}
        - {name: tls, mountPath: /tls}
      volumes:
      - name: config
        configMap: {name: pebble-config}
      - name: tls
        secret: {secretName: pebble-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: pebble
  namespace: pebble
spec:
  selector: {app: pebble}
  ports:
  - {name: acme, port: 14000, targetPort: acme}
  - {name: mgmt, port: 15000, targetPort: 15000}   # management API: roots, for the lab
