# allcsvideos: three small services, one image (SERVICE and APP_VERSION pick the name and version)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
      version: v1
  template:
    metadata:
      labels:
        app: storefront
        version: v1
    spec:
      containers:
      - name: app
        image: svc:1.0
        env:
        - {name: SERVICE, value: storefront}
        - {name: APP_VERSION, value: "1.0.0"}
        ports:
        - {name: http, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  selector:
    app: storefront
    version: v1
  ports:
  - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
      version: v1
