        ports:
        - {name: http, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api-v1
spec:
  selector:
    app: api
    version: v1
  ports:
  - {name: http, port: 80, targetPort: http}
---
