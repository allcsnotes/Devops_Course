# api version 2.0.0: the canary for Part 2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
      version: v2
  template:
    metadata:
      labels:
        app: api
        version: v2
    spec:
      containers:
      - name: app
        image: svc:1.0
        env:
        - {name: SERVICE, value: api}
        - {name: APP_VERSION, value: "2.0.0"}
        ports:
        - {name: http, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: api-v2
spec:
  selector:
    app: api
    version: v2
  ports:
  - {name: http, port: 80, targetPort: http}
