# www.allcsvideos.test with a certificate from the ACME issuer (HTTP-01 challenge)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: www
  annotations:
    cert-manager.io/cluster-issuer: pebble
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - www.allcsvideos.test
    secretName: www-tls
  rules:
  - host: www.allcsvideos.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: storefront
            port:
              name: http
