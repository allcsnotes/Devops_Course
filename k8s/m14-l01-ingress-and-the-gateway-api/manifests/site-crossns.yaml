# /copilot now goes to the Service in the copilot namespace
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site
spec:
  parentRefs:
  - name: allcsvideos
    namespace: gateway-infra
  hostnames: [allcsvideos.test]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /api}
    filters:
    - type: URLRewrite                         # a standard filter, not an annotation
      urlRewrite:
        path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
    backendRefs:
    - {name: api-v1, port: 80}
  - matches:
    - path: {type: PathPrefix, value: /copilot}
    backendRefs:
    - {name: copilot, namespace: copilot, port: 80}   # another namespace
  - backendRefs:                               # no match: everything else
    - {name: storefront, port: 80}
