# Canary for the API: testers pick v2 with a header, everyone else is split 90/10
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
  - name: allcsvideos
    namespace: gateway-infra
  hostnames: [api.allcsvideos.test]
  rules:
  - matches:
    - headers:
      - {name: x-canary, value: always}        # header match: always v2
    backendRefs:
    - {name: api-v2, port: 80}
  - backendRefs:                               # everyone else: weighted split
    - {name: api-v1, port: 80, weight: 90}
    - {name: api-v2, port: 80, weight: 10}
