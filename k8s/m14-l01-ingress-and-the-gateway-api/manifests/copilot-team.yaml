# The Copilot team runs its own service in its own namespace
apiVersion: v1
kind: Namespace
metadata:
  name: copilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot
  namespace: copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: copilot
      version: v1
  template:
    metadata:
      labels:
        app: copilot
        version: v1
    spec:
      containers:
      - name: app
        image: svc:1.0
        env:
        - {name: SERVICE, value: copilot}
        - {name: APP_VERSION, value: "2.0.0"}
        ports:
        - {name: http, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: copilot
  namespace: copilot
spec:
  selector:
    app: copilot
    version: v1
  ports:
  - {name: http, port: 80, targetPort: http}
