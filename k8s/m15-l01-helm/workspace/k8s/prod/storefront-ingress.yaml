apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  labels: {app: storefront, course: devops}
spec:
  ingressClassName: traefik
  rules:
  - host: allcsvideos.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: storefront, port: {name: http}}
