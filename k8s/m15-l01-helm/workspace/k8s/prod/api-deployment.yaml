apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api, course: devops}
spec:
  replicas: 3
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api, course: devops}
    spec:
      containers:
      - name: api
        image: allcsvideos/api:2.4.0
        ports:
        - {name: http, containerPort: 8080}
        envFrom:
        - configMapRef: {name: api-config}
        resources:
          requests: {cpu: 100m, memory: 96Mi}
          limits: {memory: 192Mi}
