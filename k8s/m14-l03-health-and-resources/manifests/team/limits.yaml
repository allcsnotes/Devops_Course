# defaults for containers in team-a that don't set their own, and a ceiling per container
apiVersion: v1
kind: LimitRange
metadata:
  name: team-defaults
  namespace: team-a
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 100m
      memory: 64Mi
    default:
      memory: 128Mi
    max:
      memory: 512Mi
