# the API with a memory limit of 64 MiB; POST /admin/leak makes it grow 4 MiB every half second
apiVersion: v1
kind: Pod
metadata:
  name: leaky
spec:
  containers:
  - name: api
    image: health-api:1.0.0
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 64Mi
