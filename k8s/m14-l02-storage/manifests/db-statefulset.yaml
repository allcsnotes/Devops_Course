apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db              # the headless Service that names the pods
  replicas: 3
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: postgres
        image: postgres:18.6-alpine3.24
        env:
        - name: POSTGRES_USER
          value: catalog
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-creds
              key: password
        ports:
        - name: postgres
          containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "catalog", "-h", "127.0.0.1"]
          periodSeconds: 2
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql   # PostgreSQL 18+ images
        - name: seed
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: seed
        configMap:
          name: catalog-seed
  volumeClaimTemplates:        # one PVC per pod: data-db-0, data-db-1, ...
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi
