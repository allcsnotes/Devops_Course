apiVersion: v1
kind: Pod
metadata:
  name: uploader
spec:
  containers:
  - name: app
    image: busybox:1.37.0
    command: ["sh", "-c", "echo 'kubernetes-intro.mp4' > /uploads/meera.txt; sleep 3600"]
    volumeMounts:
    - name: uploads
      mountPath: /uploads
  volumes:
  - name: uploads
    persistentVolumeClaim:
      claimName: uploads
