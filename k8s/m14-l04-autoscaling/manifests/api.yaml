# the allcsvideos API: requests = limits for CPU, a readiness probe, a 5 s cold start
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: scale-api:1.0
        env:
        - name: STARTUP_SECONDS
          value: "5"
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 2
