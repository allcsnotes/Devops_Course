- name: App settings on the web servers
  hosts: web
  become: true
  vars:
    db_host: db-01
    db_name: allcsvideos
    db_user: allcs_app
    db_password: demo-db-password-123   # FAKE demo value
  tasks:
    - name: Create /etc/allcsvideos
      ansible.builtin.file:
        path: /etc/allcsvideos
        state: directory
        mode: "0755"

    - name: Write app.env
      ansible.builtin.copy:
        dest: /etc/allcsvideos/app.env
        content: |
          APP_ENV=production
          DB_HOST={{ db_host }}
          DB_NAME={{ db_name }}
          DB_USER={{ db_user }}
          DB_PASSWORD={{ db_password }}
        mode: "0644"

- name: Health-check toolkit on every server
  hosts: all
  become: true
  tasks:
    - name: Create the hc user
      ansible.builtin.user:
        name: hc
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create /opt/hc/bin
      ansible.builtin.file:
        path: /opt/hc/bin
        state: directory
        mode: "0755"

    - name: Create /opt/hc/lib
      ansible.builtin.file:
        path: /opt/hc/lib
        state: directory
        mode: "0755"

    - name: Copy bin/hc
      ansible.builtin.copy:
        src: hc/bin/hc
        dest: /opt/hc/bin/hc
        mode: "0755"

    - name: Copy lib/checks.sh
      ansible.builtin.copy:
        src: hc/lib/checks.sh
        dest: /opt/hc/lib/checks.sh
        mode: "0644"

    - name: Copy lib/http_check.py
      ansible.builtin.copy:
        src: hc/lib/http_check.py
        dest: /opt/hc/lib/http_check.py
        mode: "0644"

    - name: Copy lib/report.py
      ansible.builtin.copy:
        src: hc/lib/report.py
        dest: /opt/hc/lib/report.py
        mode: "0644"

    - name: Link hc into the PATH
      ansible.builtin.file:
        src: /opt/hc/bin/hc
        dest: /usr/local/bin/hc
        state: link

    - name: Create /etc/hc
      ansible.builtin.file:
        path: /etc/hc
        state: directory
        mode: "0755"

    - name: Copy hc.conf
      ansible.builtin.copy:
        src: hc/conf/hc.conf
        dest: /etc/hc/hc.conf
        group: hc
        mode: "0640"

    - name: Copy hc.service
      ansible.builtin.copy:
        src: hc/systemd/hc.service
        dest: /etc/systemd/system/hc.service
        mode: "0644"

    - name: Copy hc.timer
      ansible.builtin.copy:
        src: hc/systemd/hc.timer
        dest: /etc/systemd/system/hc.timer
        mode: "0644"

    - name: Copy the logrotate rule
      ansible.builtin.copy:
        src: hc/logrotate/hc
        dest: /etc/logrotate.d/hc
        mode: "0644"

    - name: Start the hc timer
      ansible.builtin.systemd_service:
        name: hc.timer
        state: started
        enabled: true
        daemon_reload: true
