---
# site.yml: everything for the allcsvideos servers, in one file.
# (STAGED for the M12-L02 hook: lesson one's web.yml, a few weeks of copy-paste later.)

- name: Base setup for every server
  hosts: all
  become: true
  tasks:
    - name: Install curl
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install tree
      ansible.builtin.apt:
        name: tree
        state: present

    - name: Install logrotate
      ansible.builtin.apt:
        name: logrotate
        state: present

    - name: Create the deploy user
      ansible.builtin.user:
        name: deploy
        shell: /bin/bash
        comment: CI deploy user

    - name: Create the priya user
      ansible.builtin.user:
        name: priya
        shell: /bin/bash
        comment: Priya (developer)
        groups: adm
        append: true

    - name: Harden sshd
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          AllowUsers asha deploy priya
        mode: "0644"

    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted

- name: Set up web-01
  hosts: web-01
  become: true
  tasks:
    - name: Install nginx on web-01
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Write nginx.conf on web-01
      ansible.builtin.copy:
        dest: /etc/nginx/nginx.conf
        content: |
          user www-data;
          worker_processes auto;
          pid /run/nginx.pid;
          events {
              worker_connections 768;
          }
          http {
              include /etc/nginx/mime.types;
              server_tokens off;
              upstream api {
                  server 10.0.122.31:8080;
                  server 10.0.122.32:8080;
              }
              server {
                  listen 80 default_server;
                  server_name www.allcsvideos.test;
                  root /var/www/allcsvideos;
                  location = /health {
                      default_type application/json;
                      return 200 '{"status":"ok","host":"web-01"}\n';
                  }
                  location /api/ {
                      proxy_pass http://api;
                  }
              }
          }
        mode: "0644"

    - name: Create the web root on web-01
      ansible.builtin.file:
        path: /var/www/allcsvideos
        state: directory
        mode: "0755"

    - name: Home page on web-01
      ansible.builtin.copy:
        dest: /var/www/allcsvideos/index.html
        content: |
          <h1>allcsvideos</h1>
          <p>Served by web-01</p>
        mode: "0644"

    - name: Restart nginx on web-01
      ansible.builtin.service:
        name: nginx
        state: restarted
        enabled: true

