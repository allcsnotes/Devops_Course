---
# site.yml: the whole allcsvideos fleet. Each play maps a group to roles.
- name: Base setup for every server
  hosts: all
  become: true
  roles:
    - role: common
      tags: common
    - role: hc_toolkit
      tags: hc

- name: Web servers
  hosts: web
  become: true
  serial: 1   # one server at a time (more in the build video)
  roles:
    - role: nginx
      tags: nginx
    - role: app_config
      tags: app
