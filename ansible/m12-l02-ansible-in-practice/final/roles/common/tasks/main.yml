---
- name: Install the base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the users
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment }}"
    groups: "{{ item.groups }}"
    append: true
    shell: /bin/bash
  loop: "{{ common_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Authorise their SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.key }}"
    exclusive: true
  loop: "{{ common_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Harden sshd (module 2, lesson 6)
  ansible.builtin.template:
    src: 10-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart ssh
