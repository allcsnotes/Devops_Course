---
- name: Create /etc/allcsvideos
  ansible.builtin.file:
    path: /etc/allcsvideos
    state: directory
    mode: "0755"

- name: Render app.env
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/allcsvideos/app.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render features.yml
  ansible.builtin.template:
    src: features.yml.j2
    dest: /etc/allcsvideos/features.yml
    mode: "0644"
