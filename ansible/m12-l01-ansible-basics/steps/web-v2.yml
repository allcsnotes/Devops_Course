---
- name: Set up the allcsvideos web servers
  hosts: web
  become: true

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Deploy the home page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <h1>allcsvideos</h1>
          <p>Served by {{ inventory_hostname }}</p>
        owner: root
        group: root
        mode: "0644"

    - name: Check the nginx configuration
      ansible.builtin.command: nginx -t

    - name: Make sure nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
