---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Render nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    validate: nginx -t -c %s
  notify: nginx config changed

- name: Forward port 80 to the app
  ansible.builtin.template:
    src: app-proxy.conf.j2
    dest: /etc/nginx/conf.d/app-proxy.conf
    mode: "0644"
  when: nginx_app_port is not none
  notify: nginx config changed

- name: Keep nginx running
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true
