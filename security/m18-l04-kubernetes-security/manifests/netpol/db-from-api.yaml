# data: the database accepts connections on 5432 only from api pods in the api namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-from-api
  namespace: data
spec:
  podSelector:
    matchLabels: {app: db}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: api}
      podSelector:
        matchLabels: {app: api}
    ports:
    - {protocol: TCP, port: 5432}
