# api: accepts HTTP on 8080 from catalog pods (the catalog calls the API). Nothing else comes in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-catalog
  namespace: api
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: catalog}
      podSelector:
        matchLabels: {app: catalog}
    ports:
    - {protocol: TCP, port: 8080}
