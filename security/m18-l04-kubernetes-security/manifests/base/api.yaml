# api namespace: the allcsvideos API (lab stand-in). It is the only service that should talk to the database.
apiVersion: v1
kind: Secret
metadata:
  name: api-jwt-key
  namespace: api
stringData:
  key: FAKE-lab-jwt-key-0002
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: api
spec:
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api, team: platform}
    spec:
      serviceAccountName: api
      containers:
      - name: api
        image: registry.lab:5000/allcs/api:1.0
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: api
spec:
  selector: {app: api}
  ports:
  - port: 8080
