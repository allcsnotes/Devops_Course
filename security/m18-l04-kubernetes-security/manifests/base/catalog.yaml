# catalog namespace: the catalog service. In this lab its pod plays the compromised pod.
apiVersion: v1
kind: Secret
metadata:
  name: search-key
  namespace: catalog
stringData:
  key: FAKE-lab-search-key-0003
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: catalog
data:
  page-size: "24"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: catalog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: catalog
spec:
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog, team: catalog}
    spec:
      serviceAccountName: catalog
      containers:
      - name: catalog
        image: registry.lab:5000/allcs/catalog:1.0
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: catalog
spec:
  selector: {app: catalog}
  ports:
  - port: 8080
