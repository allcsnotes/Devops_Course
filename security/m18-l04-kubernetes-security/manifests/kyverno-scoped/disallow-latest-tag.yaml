apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
    namespaceSelector:              # only app namespaces: never block the cluster's own pods
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, kyverno, local-path-storage]
  validations:
  - expression: "object.spec.containers.all(c, image(c.image).tag() != 'latest')"
    message: "use a fixed image tag, not latest (or no tag)"
