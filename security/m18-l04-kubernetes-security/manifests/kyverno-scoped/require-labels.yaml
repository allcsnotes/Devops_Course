apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-labels
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
    namespaceSelector:              # only app namespaces: never block the cluster's own pods
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, kyverno, local-path-storage]
  validations:
  - expression: "['app', 'team'].all(l, l in object.metadata.?labels.orValue({}))"
    message: "pods need the labels app and team"
