apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: allcs
spec:
  provider:
    vault:
      server: "http://10.0.182.10:8200"   # lab Vault, plain HTTP (lab only)
      path: "allcs"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "catalog"
          serviceAccountRef:
            name: "catalog-eso"
            audiences: ["vault"]
