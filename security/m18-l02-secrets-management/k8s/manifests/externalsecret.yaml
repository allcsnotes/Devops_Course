apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-db
  namespace: allcs
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: catalog-db
  data:
  - secretKey: username
    remoteRef:
      key: catalog/db
      property: username
  - secretKey: password
    remoteRef:
      key: catalog/db
      property: password
