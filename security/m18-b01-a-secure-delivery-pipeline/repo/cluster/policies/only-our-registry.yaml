apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: only-our-registry
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: prod
  validations:
  - expression: "object.spec.containers.all(c, c.image.startsWith('registry.lab:5000/allcs/'))"
    message: "prod runs images from registry.lab:5000/allcs only"
