apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: signed-by-pipeline
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: prod
  matchImageReferences:
  - glob: "registry.lab:5000/allcs/*"
  credentials:
    allowInsecureRegistry: true     # lab registry speaks plain HTTP
  attestors:                        # PIPELINE_PUBLIC_KEY: replaced by your cosign.pub (README, step 5)
  - name: ci
    cosign:
      key:
        data: |
          PIPELINE_PUBLIC_KEY
      ctlog:
        insecureIgnoreTlog: true    # lab: no transparency log
  validations:
  - expression: >-
      images.containers.map(image, verifyImageSignatures(image, [attestors.ci])).all(e, e > 0)
    message: "image must be signed by the pipeline key"
