# Gitea runner (gitea/runner:5.1.1) config for this lab. Only the options we change
# (full list: gitea-runner config generate).
log:
  level: info
runner:
  file: /data/.runner
  capacity: 2
  labels:
    - "ubuntu-latest:docker://gitea/runner-images:ubuntu-24.04-v26.10.01"
cache:
  enabled: false
container:
  network: tfci-net            # jobs reach http://gitea:3000
  options: --label lab=tfci
  docker_host: "-"             # never hand the Docker socket to a job
