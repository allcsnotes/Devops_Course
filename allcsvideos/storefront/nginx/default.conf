# allcsvideos storefront: static files, plus /api/ and /copilot/ proxied by service name
server {
    listen 8080;                       # unprivileged nginx: no root, no port 80
    server_tokens off;

    # Docker's embedded DNS. Names in variables are resolved per request (cached 10 s),
    # so a recreated container with a new IP is found, and nginx starts even when
    # Course Copilot (an optional profile) is not running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;
    set $copilot http://copilot:8000;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
    location /api/ {
        proxy_pass $gateway;                        # /api/courses -> gateway /api/courses
        proxy_set_header X-Request-Id $request_id;
    }
    location /copilot/ {
        rewrite ^/copilot/(.*)$ /$1 break;          # /copilot/ask -> copilot /ask
        proxy_pass $copilot;
    }
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
