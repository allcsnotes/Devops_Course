global:
  scrape_interval: 15s       # how often to pull every target
  evaluation_interval: 15s

scrape_configs:
  - job_name: node           # the machine: CPU, memory, disk
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: api            # the allcsvideos API, two copies
    static_configs:
      - targets: ["api-1:8080", "api-2:8080"]

  - job_name: copilot        # Course Copilot
    static_configs:
      - targets: ["copilot:8000"]
