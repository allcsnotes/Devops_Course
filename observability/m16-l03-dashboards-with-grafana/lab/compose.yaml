# allcsvideos dashboards lab (M16-L03): API x2 + catalog db, Course Copilot, node_exporter, Prometheus, Grafana
name: m16-dashboards

x-labels: &labels
  course: devops

x-api: &api
  image: m16-dashboards/api:1.0
  build: ./api
  environment:
    DB_HOST: db
    DB_PASSWORD: demo-password-123              # FAKE lab password
    APP_VERSION: ${API_VERSION:-1.0}
    DEFAULT_SORT: ${API_DEFAULT_SORT:-id}       # v1.1 sets "popular"
  depends_on:
    db: {condition: service_healthy}
  cpus: 1.0
  mem_limit: 256m
  restart: unless-stopped
  labels: *labels

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: catalog
      POSTGRES_PASSWORD: demo-password-123      # FAKE lab password
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "catalog"]
      interval: 2s
      retries: 60
    cpus: 1.0
    mem_limit: 512m
    labels: *labels

  api-1: *api
  api-2: *api

  copilot:
    image: m16-dashboards/copilot:1.0
    build: ./copilot
    environment:
      MODEL_DELAY_MS: "120"     # lab: plays the model call
      FAULT_RATE: "0.03"        # lab: 3% of answers fail, staged on purpose
      PROMETHEUS_DISABLE_CREATED_SERIES: "True"
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    labels: *labels

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro"]
    pid: host
    labels: *labels

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - tsdb:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    labels: *labels

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: fake-admin-pass-123   # FAKE lab password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro   # data sources + dashboard providers
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro   # dashboard JSON, from Git
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    labels: *labels

  loadgen:
    profiles: [load]
    image: python:3.13.16-slim
    command: ["python", "-u", "/loadgen.py"]
    volumes: ["./loadgen/loadgen.py:/loadgen.py:ro"]
    labels: *labels

volumes:
  pgdata: {labels: *labels}
  tsdb: {labels: *labels}
  grafana: {labels: *labels}

networks:
  default:
    labels: *labels
