# M16-L06 lab: the allcsvideos API (lab build) + catalog db + students, Prometheus rules -> Alertmanager -> receiver
name: m16-alerting
services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: catalog
      POSTGRES_PASSWORD: demo-password-123   # fake lab password
    volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "catalog"]
      interval: 2s
      retries: 60
    cpus: 1.0
    mem_limit: 384m
    labels: [course=devops]
  api:
    build: ./api
    image: m16-alerting-api:1.0
    environment:
      DB_HOST: db
      DB_PASSWORD: demo-password-123        # fake lab password
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
    cpus: 1.0
    mem_limit: 192m
    labels: [course=devops]
  load:
    image: python:3.13.16-slim
    command: ["python", "-u", "/load/traffic.py"]
    environment: {RATE: "10"}
    volumes: ["./load:/load:ro"]
    depends_on: [api]
    mem_limit: 128m
    labels: [course=devops]
  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/${PROM_CONFIG:-prometheus.yml}", "--web.enable-lifecycle"]
    volumes: ["./prometheus:/etc/prometheus:ro"]
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 256m
    labels: [course=devops]
  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/${AM_CONFIG:-alertmanager.yml}", "--storage.path=/alertmanager"]
    volumes: ["./alertmanager:/etc/alertmanager:ro"]
    ports: ["127.0.0.1:9093:9093"]
    mem_limit: 128m
    labels: [course=devops]
  receiver:
    image: python:3.13.16-slim
    command: ["python", "-u", "/r/receiver.py"]
    volumes: ["./receiver:/r:ro", "./runs:/data"]
    mem_limit: 96m
    labels: [course=devops]
networks:
  default:
    labels: [course=devops]
