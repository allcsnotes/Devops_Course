route:                                  # the routing tree: every alert enters at the root
  receiver: chat                        # default: anything no child route matches
  group_by: [alertname, job]
  group_wait: 30s                       # wait for more alerts before the first notification
  group_interval: 2m                    # then at most one update per group every 2m
  repeat_interval: 4h                   # re-send a still-firing group after 4h
  routes:
    - matchers: [alertname="Watchdog"]
      receiver: heartbeat
      repeat_interval: 1m
    - matchers: [severity="page"]
      receiver: pager
      group_by: [job]                   # one page per service, not one per alert
      group_wait: 10s
      group_interval: 1m
    - matchers: [severity="ticket"]
      receiver: tickets
      repeat_interval: 24h
inhibit_rules:                          # mute tickets while the same job is already paging
  - source_matchers: [severity="page"]
    target_matchers: [severity="ticket"]
    equal: [job]
receivers:                              # lab stand-ins: one webhook receiver, a path each
  - name: pager
    webhook_configs: [{url: "http://receiver:8080/pager"}]
  - name: tickets
    webhook_configs: [{url: "http://receiver:8080/tickets"}]
  - name: chat
    webhook_configs: [{url: "http://receiver:8080/chat"}]
  - name: heartbeat
    webhook_configs: [{url: "http://receiver:8080/heartbeat"}]
