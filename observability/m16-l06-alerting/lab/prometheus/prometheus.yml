global:
  scrape_interval: 15s
  evaluation_interval: 15s      # how often rules are evaluated
rule_files:
  - rules.yml                   # recording rules
  - alerts.yml                  # alerting rules
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
