# the first attempt (hook): same scrapes, naive alert rules
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - alerts-naive.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
