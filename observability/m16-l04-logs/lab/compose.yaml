# M16-L04 lab: two allcsvideos services that log JSON, Alloy -> Loki -> Grafana, and simulated students
name: m16-logs
x-app: &app
  build: ./app
  image: m16-logs-app:1.0
  labels: [course=devops]
  cpus: 1.0
  mem_limit: 128m
services:
  web:
    <<: *app
    environment: {SERVICE: web, LOG_LEVEL: "${LOG_LEVEL:-info}", REDACT: "${REDACT:-1}", LOG_FORMAT: "${LOG_FORMAT:-json}"}
    ports: ["127.0.0.1:8080-8081:8080"]
    deploy: {replicas: 2}
  api:
    <<: *app
    environment: {SERVICE: api, LOG_LEVEL: "${LOG_LEVEL:-info}", REDACT: "${REDACT:-1}", LOG_FORMAT: "${LOG_FORMAT:-json}"}
    deploy: {replicas: 2}
  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./loki/loki.yaml:/etc/loki/loki.yaml:ro", "loki-data:/loki"]
    ports: ["127.0.0.1:3100:3100"]
    labels: [course=devops]
    cpus: 1.5
    mem_limit: 1g
  alloy:
    image: grafana/alloy:v1.21.0
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data", "--server.http.listen-addr=0.0.0.0:12345"]
    volumes: ["./alloy/config.alloy:/etc/alloy/config.alloy:ro", "/var/run/docker.sock:/var/run/docker.sock:ro"]
    labels: [course=devops]
    depends_on: [loki]
    cpus: 1.0
    mem_limit: 512m
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # lab only: no login screen
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["127.0.0.1:3000:3000"]
    labels: [course=devops]
    cpus: 0.5
    mem_limit: 512m
  load:
    build: ./load
    image: m16-logs-load:1.0
    profiles: [load]
    volumes: ["./runs:/runs"]
    labels: [course=devops]
    cpus: 1.0
volumes:
  loki-data:
    labels: [course=devops]
networks:
  default:
    labels: [course=devops]
