# allcsvideos SLO lab (M17-L01): catalog API + db, simulated students, Prometheus with SLO rules, Grafana
name: slo-lab

x-labels: &labels
  course: devops

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: catalog
      POSTGRES_PASSWORD: demo-password-123      # FAKE lab password
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "catalog"]
      interval: 2s
      retries: 60
    mem_limit: 256m
    labels: *labels

  api:
    image: slo-lab/api:${API_VERSION:-1.0}
    build: ./api
    environment:
      DB_HOST: db
      DB_PASSWORD: demo-password-123            # FAKE lab password
      APP_VERSION: ${API_VERSION:-1.0}
      FAULT_RATE: ${API_FAULT_RATE:-0}          # staged bug in 1.1
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 256m
    restart: unless-stopped
    labels: *labels

  loadgen:                                      # simulated students, 10 requests a second
    image: python:3.13.16-slim
    command: ["python", "-u", "/loadgen.py"]
    environment:
      RATE: "10"
    volumes: ["./loadgen/loadgen.py:/loadgen.py:ro"]
    labels: *labels

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus:/etc/prometheus:ro         # prometheus.yml + SLO rules
      - ./history:/history:ro                   # backfill input (synthetic 30-day history)
      - tsdb:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    labels: *labels

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: fake-admin-pass-123   # FAKE lab password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 768m
    labels: *labels

volumes:
  pgdata: {labels: *labels}
  tsdb: {labels: *labels}
  grafana: {labels: *labels}

