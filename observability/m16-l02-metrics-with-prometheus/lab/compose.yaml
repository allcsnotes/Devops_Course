# allcsvideos metrics lab (M16-L02): Course Copilot x2, node_exporter and Prometheus
# Ports (localhost only): copilot-1 8000, node exporter 9100, Prometheus 9090
name: m16-metrics

x-labels: &labels
  course: devops

x-copilot: &copilot
  image: m16-metrics/copilot:1.0
  build: ./copilot
  environment:
    MODEL_DELAY_MS: "120"     # lab: plays the model call
    FAULT_RATE: "0.03"        # lab: 3% of answers fail, staged on purpose
    PROMETHEUS_DISABLE_CREATED_SERIES: "True"
    TRACK_USERS: ${TRACK_USERS:-0}    # Priya's change: user_id label on the histogram
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped
  labels: *labels

services:
  copilot-1:
    <<: *copilot
    ports: ["127.0.0.1:8000:8000"]
  copilot-2:
    <<: *copilot

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro"]
    pid: host
    ports: ["127.0.0.1:9100:9100"]
    labels: *labels

  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - tsdb:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    labels: *labels

  loadgen:
    profiles: [load]
    image: python:3.13.16-slim
    command: ["python", "-u", "/loadgen.py"]
    environment:
      RATE: "10"
      USERS: ${USERS:-50}
    volumes: ["./loadgen/loadgen.py:/loadgen.py:ro"]
    labels: *labels

volumes:
  tsdb:
    labels: *labels

networks:
  default:
    labels: *labels
