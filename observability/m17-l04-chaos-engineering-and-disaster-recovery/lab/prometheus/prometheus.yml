global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [sli.yml]
scrape_configs:
  - job_name: students           # the simulated students: the SLI, measured from the user side
    static_configs: [{targets: ["students:9100"]}]
  - job_name: api                # each API replica (server side)
    static_configs: [{targets: ["api1:8080", "api2:8080"]}]
