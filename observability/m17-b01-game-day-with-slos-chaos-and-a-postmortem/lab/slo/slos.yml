# The allcsvideos SLOs as code (Sloth spec, lesson 1). `sloth generate` turns this into the production recording rules
# and multiwindow, multi-burn-rate alerts (30-day budgets, pages on 1h + 5m and 6h + 30m).
version: "prometheus/v1"
service: "allcsvideos"
labels:
  owner: "platform-team"
slos:
  - name: "catalog-availability"
    objective: 99.9
    description: "Course-list requests that get an answer that is not a 5xx, measured at the client"
    sli:
      events:
        error_query: sum(rate(http_requests_total{job="students",route="/api/courses",code=~"5..|error"}[{{.window}}]))
        total_query: sum(rate(http_requests_total{job="students",route="/api/courses"}[{{.window}}]))
    alerting:
      name: CatalogAvailabilityBudgetBurn
      page_alert: {labels: {severity: page}}
      ticket_alert: {labels: {severity: ticket}}
  - name: "catalog-latency"
    objective: 99
    description: "Course-list requests answered within 250 ms, measured at the client"
    sli:
      events:
        error_query: >-
          sum(rate(http_request_duration_seconds_count{job="students",route="/api/courses"}[{{.window}}]))
          - sum(rate(http_request_duration_seconds_bucket{job="students",route="/api/courses",le="0.25"}[{{.window}}]))
        total_query: sum(rate(http_request_duration_seconds_count{job="students",route="/api/courses"}[{{.window}}]))
    alerting:
      name: CatalogLatencyBudgetBurn
      page_alert: {labels: {severity: page}}
      ticket_alert: {labels: {severity: ticket}}
  - name: "copilot-availability"
    objective: 99
    description: "Course Copilot questions that get an answer that is not a 5xx, measured at the client"
    sli:
      events:
        error_query: sum(rate(http_requests_total{job="students",route="/api/ask",code=~"5..|error"}[{{.window}}]))
        total_query: sum(rate(http_requests_total{job="students",route="/api/ask"}[{{.window}}]))
    alerting:
      name: CopilotAvailabilityBudgetBurn
      page_alert: {labels: {severity: page}}
      ticket_alert: {labels: {severity: ticket}}
