# allcsvideos load balancer: two API replicas, passive health checks (module 9, lesson 2; lesson 4's lab)
events {}
http {
  access_log off;
  upstream api {
    zone api 64k;                                  # shared state, so all workers agree a replica is down
    server api1:8080 max_fails=1 fail_timeout=5s;  # one failure: skip this replica for 5 seconds
    server api2:8080 max_fails=1 fail_timeout=5s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
      proxy_next_upstream error timeout;           # retry another replica (GET only, never a POST)
    }
  }
}
