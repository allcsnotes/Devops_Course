global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [slo-gameday.yml]
alerting:
  alertmanagers: [{static_configs: [{targets: ["alertmanager:9093"]}]}]
scrape_configs:
  - job_name: students           # the simulated students: the SLIs, measured where the users are
    static_configs: [{targets: ["students:9100"]}]
  - job_name: api                # each API replica (server side)
    static_configs: [{targets: ["api1:9100", "api2:9100"]}]
