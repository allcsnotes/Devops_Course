# allcsvideos load balancer: two API replicas, passive health checks (module 9, lesson 2; lesson 4's lab)
events {}
http {
  access_log off;
  upstream api {
    zone api 64k;                                  # shared state, so all workers agree a replica is down
    server api1:8080 max_fails=1 fail_timeout=5s;  # one failure: skip this replica for 5 seconds
    server api2:8080 max_fails=1 fail_timeout=5s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
      proxy_next_upstream error timeout;           # retry another replica (GET only, never a POST)
    }
    location /api/ask {                            # game-day fix: a slow Copilot answer is not a dead replica.
      proxy_pass http://api;                       # proxy_next_upstream also defines what max_fails counts:
      proxy_connect_timeout 1s;                    # with "error" only, a timed-out question no longer marks
      proxy_read_timeout 2s;                       # the replica as failed for 5 seconds
      proxy_next_upstream error;
    }
  }
}
