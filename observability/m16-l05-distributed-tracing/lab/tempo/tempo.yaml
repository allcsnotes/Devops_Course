# Grafana Tempo 3.1.0, single binary (monolithic mode, no Kafka), local disk storage for the lab.
# In production the storage backend is object storage: s3, gcs or azure.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: "0.0.0.0:4317"}
storage:
  trace:
    backend: local
    wal: {path: /var/tempo/wal}
    local: {path: /var/tempo/blocks}
usage_report:
  reporting_enabled: false
