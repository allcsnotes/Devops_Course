# OpenTelemetry Collector (contrib 0.163.1): receive OTLP, batch, send traces to Jaeger AND Tempo, logs to Loki
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  memory_limiter: {check_interval: 1s, limit_mib: 200}
  batch: {timeout: 2s, send_batch_size: 512}

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls: {insecure: true}
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/jaeger, otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus: {host: 0.0.0.0, port: 8888}
