# M16-L05 lab: three allcsvideos services instrumented with OpenTelemetry -> Collector -> Jaeger and Tempo (+ Loki, Prometheus, Grafana)
name: m16-tracing
x-svc: &svc
  build: ./app
  image: m16-tracing-app:1.0
  labels: [course=devops]
  cpus: 0.5
  mem_limit: 160m
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: otlp
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
  OTEL_PYTHON_FLASK_EXCLUDED_URLS: "healthz,metrics"   # no spans for health checks and scrapes
services:
  bff:
    <<: *svc
    environment:
      <<: *otel
      SERVICE: bff
      OTEL_SERVICE_NAME: storefront-bff
      OTEL_TRACES_SAMPLER: ${BFF_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${BFF_SAMPLER_ARG:-1.0}
    ports: ["127.0.0.1:8080:8080"]
  api:
    <<: *svc
    environment:
      <<: *otel
      SERVICE: api
      OTEL_SERVICE_NAME: api
      LEGACY_CLIENT: ${LEGACY_CLIENT:-0}
  catalog:
    <<: *svc
    environment:
      <<: *otel
      SERVICE: catalog
      OTEL_SERVICE_NAME: catalog-service
      DATABASE_URL: postgresql://postgres:demo-password-123@db:5432/catalog   # fake lab password
      QUERY_MODE: ${QUERY_MODE:-per_course}
      FAULT_RATE: ${FAULT_RATE:-0}
      SPAN_PER_ID: ${SPAN_PER_ID:-0}
    depends_on:
      db: {condition: service_healthy}
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: catalog
      POSTGRES_PASSWORD: demo-password-123   # fake lab password
    volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "catalog"]
      interval: 2s
      retries: 90
    labels: [course=devops]
    cpus: 1.0
    mem_limit: 384m
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otelcol/${OTELCOL_CONFIG:-config.yaml}"]
    volumes: ["./otelcol:/etc/otelcol:ro"]
    ports: ["127.0.0.1:8888:8888"]
    labels: [course=devops]
    cpus: 0.5
    mem_limit: 256m
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports: ["127.0.0.1:16686:16686"]
    labels: [course=devops]
    cpus: 0.5
    mem_limit: 256m
  tempo:
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes: ["./tempo:/etc/tempo:ro", "tempo-data:/var/tempo"]
    ports: ["127.0.0.1:3200:3200"]
    labels: [course=devops]
    cpus: 0.5
    mem_limit: 384m
  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./loki:/etc/loki:ro", "loki-data:/loki"]
    ports: ["127.0.0.1:3100:3100"]
    labels: [course=devops]
    cpus: 0.5
    mem_limit: 384m
  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--enable-feature=exemplar-storage"]
    volumes: ["./prometheus:/etc/prometheus:ro"]
    ports: ["127.0.0.1:9090:9090"]
    labels: [course=devops]
    cpus: 0.5
    mem_limit: 256m
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # lab only: no login screen
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["127.0.0.1:3000:3000"]
    labels: [course=devops]
    cpus: 0.5
    mem_limit: 768m
  load:
    image: python:3.13.16-slim
    profiles: [load]
    command: ["python", "/load/traffic.py"]
    environment: {N: "${N:-300}", RATE: "${RATE:-10}"}
    volumes: ["./load:/load:ro"]
    labels: [course=devops]
volumes:
  tempo-data: {labels: [course=devops]}
  loki-data: {labels: [course=devops]}
networks:
  default:
    labels: [course=devops]
