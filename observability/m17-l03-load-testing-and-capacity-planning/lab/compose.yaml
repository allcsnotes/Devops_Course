# allcsvideos load-testing lab (M17-L03): API + catalog db, Prometheus (remote-write receiver), Grafana
name: loadtest-lab

x-labels: &labels
  course: devops

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: catalog
      POSTGRES_PASSWORD: demo-password-123      # FAKE lab password
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "catalog"]
      interval: 2s
      retries: 60
    labels: *labels

  api:
    image: loadtest-lab/api:1.0
    build: ./api
    environment:
      DB_HOST: db
      DB_PASSWORD: demo-password-123            # FAKE lab password
      APP_VERSION: ${API_VERSION:-1.0}
      WORK: ${API_WORK:-100000}                 # ranking work per request (v1.1 doubles it)
    depends_on:
      db: {condition: service_healthy}
    cpus: 1.0                                   # one CPU: a stable, repeatable limit
    mem_limit: 256m
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    labels: *labels

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver      # k6 pushes its metrics here
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - tsdb:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    labels: *labels

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: fake-admin-pass-123   # FAKE lab password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    mem_limit: 768m
    ports: ["127.0.0.1:3000:3000"]
    labels: *labels

  k6:                                           # the load generator: ./k6 run tests/smoke.js
    image: grafana/k6:2.3.0
    profiles: [tools]                           # only started by "docker compose run"
    working_dir: /lab
    volumes: ["./tests:/lab/tests:ro"]
    environment:
      BASE_URL: http://api:8080
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write   # for -o experimental-prometheus-rw
      K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99)"
      K6_NO_USAGE_REPORT: "true"
    labels: *labels

volumes:
  pgdata: {labels: *labels}
  tsdb: {labels: *labels}
  grafana: {labels: *labels}

networks:
  default:
    labels: *labels
