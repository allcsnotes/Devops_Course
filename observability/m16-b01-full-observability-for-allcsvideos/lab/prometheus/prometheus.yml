global:
  scrape_interval: 15s
  evaluation_interval: 15s      # how often rules are evaluated
rule_files:
  - rules.yml                   # recording rules
  - alerts.yml                  # alerting rules
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:                 # the Postgres metrics arrive from Alloy by remote write
  - job_name: api
    static_configs: [{targets: ["api:8080"]}]
  - job_name: copilot
    static_configs: [{targets: ["copilot:8000"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: otelcol
    static_configs: [{targets: ["otelcol:8888"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager:9093"]}]
