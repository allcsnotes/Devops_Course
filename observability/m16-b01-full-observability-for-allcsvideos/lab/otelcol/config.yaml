# OpenTelemetry Collector (contrib 0.163.1): receive OTLP from the services, batch, send traces to Tempo
receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}

processors:
  memory_limiter: {check_interval: 1s, limit_mib: 160}
  batch: {timeout: 2s, send_batch_size: 512}

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus: {host: 0.0.0.0, port: 8888}
