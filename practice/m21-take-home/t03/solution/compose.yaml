# allcsvideos course API: nginx -> api -> PostgreSQL + Redis. Only nginx is published, on 127.0.0.1.
name: m21lab-t03

x-common: &common
  restart: unless-stopped
  labels: {course: devops}
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  proxy:
    <<: *common
    image: nginxinc/nginx-unprivileged:1.29.8-alpine
    ports: ["127.0.0.1:21053:8080"]
    volumes: ["./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 5s
      timeout: 2s
      retries: 3
    depends_on:
      api: {condition: service_healthy}

  api:
    <<: *common
    build: ./api
    image: m21lab-t03-api:1.0.0
    init: true
    environment:
      DB_HOST: db
      DB_NAME: allcs
      DB_USER: allcs
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_HOST: redis
    secrets: [db_password]
    networks: [frontend, backend]
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  db:
    <<: *common
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: allcs
      POSTGRES_DB: allcs
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks: [backend]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "allcs", "-d", "allcs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *common
    image: redis:8.10.2-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [backend]
    read_only: true
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 3

networks:
  frontend: {}
  backend: {internal: true}

volumes:
  db-data: {}

secrets:
  db_password:
    file: ./secrets/db_password.txt
