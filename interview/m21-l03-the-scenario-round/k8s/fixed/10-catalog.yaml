# catalog, fixed: the probes ask a small health thread on port 8081, so a long queue on the worker
# is no longer a "dead" pod. Liveness still restarts a worker that is truly stuck (one request > 10 s).
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog, namespace: allcs}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalog}}
  template:
    metadata: {labels: {app: catalog}}
    spec:
      containers:
      - name: api
        image: scenario-catalog:1.0
        imagePullPolicy: IfNotPresent
        env:
        - {name: APP_NAME, value: catalog}
        - {name: WORK_MS, value: "20"}
        - {name: CACHE_MB, value: "40"}
        - {name: TZ, value: "IST-5:30"}
        - {name: HEALTH_PORT, value: "8081"}
        - {name: STUCK_S, value: "10"}
        ports:
        - {name: http, containerPort: 8080}
        - {name: health, containerPort: 8081}
        readinessProbe:
          httpGet: {path: /healthz, port: health}
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 2
        livenessProbe:
          httpGet: {path: /healthz, port: health}
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          requests: {cpu: 250m}
          limits: {cpu: 500m}
