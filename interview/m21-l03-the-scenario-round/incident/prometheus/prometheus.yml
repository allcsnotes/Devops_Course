global:
  scrape_interval: 5s          # lab: fast, so the demo reacts in seconds
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]
scrape_configs:
  - job_name: catalog-api
    static_configs: [{targets: ["api:8080"], labels: {service: catalog-api}}]
