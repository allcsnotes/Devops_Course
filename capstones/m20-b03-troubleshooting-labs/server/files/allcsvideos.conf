# /etc/nginx/sites-available/allcsvideos: TLS for www.allcsvideos.test, /api/ to the API on 127.0.0.1:8080
server {
    listen 443 ssl;
    server_name www.allcsvideos.test;
    ssl_certificate     /etc/nginx/tls/www.allcsvideos.test.crt;
    ssl_certificate_key /etc/nginx/tls/www.allcsvideos.test.key;
    root /var/www/allcs;
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
