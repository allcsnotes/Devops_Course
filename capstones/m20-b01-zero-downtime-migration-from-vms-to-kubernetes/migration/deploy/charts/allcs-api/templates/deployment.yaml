apiVersion: apps/v1
kind: Deployment
metadata:
  name: allcs-api
  labels: {app: allcs-api}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app: allcs-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # a new pod is Ready before an old one goes
  template:
    metadata:
      labels: {app: allcs-api}
    spec:
      terminationGracePeriodSeconds: 30              # preStop (5 s) + draining must fit inside this
      containers:
      - name: api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports: [{name: http, containerPort: 8080}]
        env:
        - {name: APP_VERSION, value: "{{ .Values.image.tag }}"}
        - {name: DB_HOST, value: "{{ .Values.db.host }}"}
        - {name: DB_POOL, value: "{{ .Values.db.pool }}"}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: {{ .Values.db.passwordSecret }}, key: password}}
        - name: SESSION_SECRET
          valueFrom: {secretKeyRef: {name: {{ .Values.session.existingSecret | default "allcs-api-session-dev" }}, key: key}}
        readinessProbe:                              # traffic only once the pool is open; 503 while draining
          httpGet: {path: /readyz, port: http}
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 1
        livenessProbe:                               # the process only, never the database
          httpGet: {path: /healthz, port: http}
          periodSeconds: 10
          timeoutSeconds: 3
        lifecycle:
          preStop:
            sleep: {seconds: 5}                      # keep serving while every proxy forgets this pod
        resources: {{- toYaml .Values.resources | nindent 10 }}
