# edge load balancer for allcsvideos.com (lab): every student request enters here.
# Two pools: the VM fleet from module 12, and the Kubernetes Service (NodePort on the kind node).
worker_processes 1;
events { worker_connections 1024; }
http {
  access_log off;
  upstream vm_pool {
    zone vm_pool 64k;                                  # shared state, so all workers agree a server is down
    server 10.0.201.11:8080 max_fails=1 fail_timeout=5s;   # web-01
    server 10.0.201.12:8080 max_fails=1 fail_timeout=5s;   # web-02
    keepalive 16;                                      # reuse connections to the app
  }
  upstream k8s_pool {
    zone k8s_pool 64k;
    server 10.0.201.60:30080;                          # the kind node, Service allcs-api (NodePort)
    keepalive 16;
  }
  include /etc/nginx/split/weights.conf;               # sets $pool for each request (written by shift.sh)
  server {
    listen 80;
    location / {
      proxy_pass http://$pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";                  # needed for upstream keep-alive
      proxy_set_header Host $host;
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
      add_header X-Edge-Pool $pool always;             # which pool answered (k6 records it)
    }
  }
}
