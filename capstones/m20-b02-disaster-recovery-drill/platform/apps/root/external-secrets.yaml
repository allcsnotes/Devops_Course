# External Secrets Operator 2.13.0 (Helm chart, pinned): copies secrets from Vault into Kubernetes Secrets
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.13.0
    helm:
      valuesObject:
        installCRDs: true
        webhook: {create: false}          # lab: fewer pods on a busy laptop
        certController: {create: false}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: {limit: 20, backoff: {duration: 10s, factor: 2, maxDuration: 1m}}
