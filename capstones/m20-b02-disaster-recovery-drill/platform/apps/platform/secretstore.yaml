# ESO -> Vault: KV v2 mount "allcs", logging in with the catalog-eso service account (Kubernetes auth)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: allcs
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true   # the CRD arrives with ESO
spec:
  provider:
    vault:
      server: "http://10.0.202.11:8200"   # lab Vault, plain HTTP (lab only)
      path: "allcs"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "catalog"
          serviceAccountRef:
            name: "catalog-eso"
            audiences: ["vault"]
