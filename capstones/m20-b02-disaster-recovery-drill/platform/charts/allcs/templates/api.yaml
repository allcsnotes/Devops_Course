apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api}
spec:
  replicas: {{ .Values.api.replicas }}
  selector: {matchLabels: {app: api}}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
      - name: api
        image: {{ .Values.api.image }}
        ports: [{containerPort: 8080}]
        env:
        - {name: DB_HOST, value: "{{ .Values.api.dbHost }}"}
        - name: DB_USER
          valueFrom: {secretKeyRef: {name: catalog-db, key: username}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: catalog-db, key: password}}
        readinessProbe:
          httpGet: {path: /readyz, port: 8080}
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 48Mi}
          limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports: [{port: 8080, targetPort: 8080}]
