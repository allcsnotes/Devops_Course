# the database login: Vault allcs/catalog/db -> Kubernetes Secret catalog-db (refreshed every 30 s)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-db
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: "30s"
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: catalog-db}
  data:
  - secretKey: username
    remoteRef: {key: catalog/db, property: username}
  - secretKey: password
    remoteRef: {key: catalog/db, property: password}
