# the storefront: a static page + /api/* proxied to the catalog API
apiVersion: v1
kind: ConfigMap
metadata:
  name: web
data:
  default.conf: |
    server {
      listen 8080;
      location /api/ { proxy_pass http://api:8080; proxy_connect_timeout 2s; proxy_read_timeout 5s; }
      location / { root /usr/share/nginx/html; index index.html; }
    }
  index.html: |
    <!doctype html><title>allcsvideos.com</title><h1>allcsvideos.com</h1>
    <p>Courses: <a href="/api/courses">/api/courses</a></p>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: {{ .Values.web.image }}
        ports: [{containerPort: 8080}]
        volumeMounts:
        - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
        - {name: conf, mountPath: /usr/share/nginx/html/index.html, subPath: index.html}
        readinessProbe:
          httpGet: {path: /, port: 8080}
          periodSeconds: 5
        resources:
          requests: {cpu: 20m, memory: 16Mi}
          limits: {memory: 64Mi}
      volumes:
      - name: conf
        configMap: {name: web}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector: {app: web}
  ports: [{port: 8080, targetPort: 8080, nodePort: {{ .Values.web.nodePort }}}]
