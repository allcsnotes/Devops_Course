# kind-cluster.yaml: the production Kubernetes cluster dr (lab: ONE node, the control plane).
# The node also joins the lab network as 10.0.202.30 (cluster.sh): users reach the storefront on node port 30080 there,
# Vault reaches the API server there (Kubernetes auth), so that address is in the API server certificate.
# containerd reads per-registry hosts.toml files: the node pulls our images from registry.lab:5000 (plain HTTP, lab only).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
- |-
  [plugins."io.containerd.cri.v1.images".registry]
    config_path = "/etc/containerd/certs.d"
kubeadmConfigPatches:
- |
  kind: InitConfiguration
  timeouts:                 # the laptop is shared with parallel labs: give a slow start more time (kubeadm v1beta4)
    controlPlaneComponentHealthCheck: 10m0s
    kubeletHealthCheck: 10m0s
    kubernetesAPICall: 5m0s
- |
  kind: ClusterConfiguration
  apiServer:
    certSANs: ["10.0.202.30"]
  controllerManager:
    extraArgs:
    - {name: leader-elect-lease-duration, value: "90s"}
    - {name: leader-elect-renew-deadline, value: "60s"}
    - {name: leader-elect-retry-period, value: "10s"}
  scheduler:
    extraArgs:
    - {name: leader-elect-lease-duration, value: "90s"}
    - {name: leader-elect-renew-deadline, value: "60s"}
    - {name: leader-elect-retry-period, value: "10s"}
nodes:
- role: control-plane
