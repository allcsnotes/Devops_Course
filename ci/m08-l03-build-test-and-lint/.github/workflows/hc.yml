# hc.yml (M08-L03): shellcheck, then the hc tests. Copy to .github/workflows/hc.yml.
name: hc
on:
  push:
    branches: [main]
    paths: ["hc/**", ".github/workflows/hc.yml"]
  pull_request:
    paths: ["hc/**", ".github/workflows/hc.yml"]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://koalaman/shellcheck:v0.11.0
        with:
          args: hc/bin/hc hc/check.sh hc/install.sh hc/lib/checks.sh hc/tests/run.sh

  test:
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the hc tests
        run: bash hc/tests/run.sh
