# /srv/lb/conf.d/site.conf - the load balancer for Course Copilot on prod-01
# $pool (blue or green) comes from route.conf; the pools themselves are in upstreams.conf
log_format lb '$msec $pool $upstream_addr $status "$request"';

server {
    listen 80;
    access_log /var/log/nginx/lb.log lb;

    location / {
        proxy_pass http://$pool;            # send the request to the chosen pool
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout;  # nginx default: on a failed connection, try the next server
    }
}
