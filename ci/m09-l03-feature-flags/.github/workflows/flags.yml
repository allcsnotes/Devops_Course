# flags.yml (M09-L03): the flag inventory is checked on every push and pull request.
# Fails on a flag with no owner/type, a release or experiment flag past its expiry date, or a removed flag whose
# name is still referenced anywhere in the repository (git grep). Copy to .github/workflows/flags.yml.
name: flags
on:
  push:
    branches: [main]
  pull_request:
jobs:
  flags:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install pyyaml==6.0.3
      - name: Owners, expiry dates, removed flags
        run: python flags/flag-check.py flags/flags.yaml flags/removed.txt
