# Step 1 (M09-B01): the checks - lint, unit, integration (real PostgreSQL + Redis) on every PR and push to main.
name: pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write          # GITHUB_TOKEN may push to ghcr.io

env:
  TRIVY_DISABLE_VEX_NOTICE: "true"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # ---------- 1. checks: every pull request and every push to main ----------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the Dockerfiles
        uses: docker://hadolint/hadolint:v2.15.1
        with:
          args: hadolint copilot/Dockerfile storefront/Dockerfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('copilot/requirements*.txt') }}
      - name: Ruff and mypy
        working-directory: copilot
        run: |
          pip install -q -r requirements.txt -r requirements-dev.txt
          ruff check . && ruff format --check . && mypy app

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('copilot/requirements*.txt') }}
      - name: Unit tests
        working-directory: copilot
        run: |
          pip install -q -r requirements.txt -r requirements-dev.txt
          pytest -m "not integration" --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          path: copilot/reports/

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        ports: ["5432:5432"]   # GitHub: the job runs on the VM and reaches services on localhost
        env:
          POSTGRES_USER: allcsvideos
          POSTGRES_PASSWORD: demo-password-123   # FAKE: a throwaway CI database
          POSTGRES_DB: allcsvideos
        options: >-
          --health-cmd "pg_isready -h localhost -U allcsvideos"
          --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:8.10.2-alpine3.23
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://allcsvideos:demo-password-123@localhost:5432/allcsvideos
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('copilot/requirements*.txt') }}
      - name: Migrations, then integration tests (real PostgreSQL + Redis)
        working-directory: copilot
        run: |
          pip install -q -r requirements.txt -r requirements-dev.txt
          python db/apply.py db/migrations/*.sql
          pytest -m integration -v
