# /srv/app/data.yaml : the data layer, shared by blue and green (started once: docker compose -f data.yaml up -d).
# Both colours use the same database, so schema changes must be expand-only (M09-L04).
name: data
services:
  db:
    image: postgres:18.6-alpine3.24
    env_file: secrets/postgres.env                  # POSTGRES_PASSWORD (random per host, never shown)
    environment: {POSTGRES_USER: allcsvideos, POSTGRES_DB: allcsvideos}
    volumes: [pgdata:/var/lib/postgresql]
    networks: [data]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "allcsvideos"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    labels: {course: devops}
  redis:
    image: redis:8.10.2-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    labels: {course: devops}
networks:
  data: {external: true}
volumes:
  pgdata: {}
