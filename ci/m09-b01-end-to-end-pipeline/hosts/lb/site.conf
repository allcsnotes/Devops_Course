# /srv/lb/conf.d/site.conf - the load balancer in front of the allcsvideos release (nginx 1.29.8)
# $pool (blue or green) comes from route.conf, which only the deploy agent writes
log_format lb '$msec $pool $status $upstream_addr "$request"';

upstream blue  { server 10.10.1.11:8080; }   # the blue storefront
upstream green { server 10.10.1.21:8080; }   # the green storefront

server {
    listen 80;
    access_log /var/log/nginx/lb.log lb;
    add_header X-Pool $pool always;          # every response says which colour served it

    location / {
        proxy_pass http://$pool;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
    }
}
