# pipeline.yml (M09-L01): continuous delivery for course-copilot. Copy to .github/workflows/pipeline.yml.
#   build           test, scan, push ONE image to GHCR (built once, deployed many times); outputs its digest
#   deploy-staging  every push to main, automatically: SSH to staging-01, the deploy agent pulls that digest
#   smoke-staging   health, "right build?", one real question; records passed/failed on staging
# Production is a separate, manual workflow: deploy-production.yml (GitHub Environment "production" with reviewers).
# Settings (see the lesson README): GitHub Environment "staging" with variables HOST, SSH_PORT, URL, KNOWN_HOSTS and
# the secret SSH_KEY.
name: pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/course-copilot" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:v0.33.1

      - name: Test
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test

      - name: Build for the scan
        uses: docker/build-push-action@v7
        with:
          context: .
          outputs: type=docker,dest=copilot.tar
          tags: ${{ env.IMAGE }}:scan

      - name: Scan (gate)
        uses: docker://aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
        with:
          args: image -q --input copilot.tar --scanners vuln --exit-code 1 --severity CRITICAL
        env:
          TRIVY_DISABLE_VEX_NOTICE: true

      - name: Log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (built once, deployed many times)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:sha-${{ steps.v.outputs.short }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
            APP_REVISION=${{ steps.v.outputs.short }}
          provenance: false

  deploy-staging:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: staging
    steps:
      - name: SSH key and host key for staging
        env:
          KEY: ${{ secrets.SSH_KEY }}
          KNOWN: ${{ vars.KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Deploy ${{ needs.build.outputs.version }} to staging
        run: ssh -p ${{ vars.SSH_PORT }} deploy@${{ vars.HOST }} deploy ${{ needs.build.outputs.digest }} run-${{ github.run_number }}

  smoke-staging:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: staging
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      URL: ${{ vars.URL }}
    steps:
      - name: SSH key and host key for staging
        env:
          KEY: ${{ secrets.SSH_KEY }}
          KNOWN: ${{ vars.KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Health
        run: |
          for i in $(seq 1 15); do
            if curl -sf --connect-timeout 2 "$URL/health"; then echo; exit 0; fi
            sleep 2
          done
          echo "staging is not healthy after 30 s"; exit 1

      - name: Right build?
        run: |
          curl -s "$URL/version" | tee version.json; echo
          jq -e --arg d "$DIGEST" '.digest == $d and .environment == "staging"' version.json

      - name: Ask a question
        run: curl -sf "$URL/ask?q=docker" | jq -e '.answer | test("DevOps")'

      - name: Mark verified on staging
        if: success()
        run: ssh -p ${{ vars.SSH_PORT }} deploy@${{ vars.HOST }} smoke $DIGEST passed

      - name: Mark failed on staging
        if: failure()
        run: ssh -p ${{ vars.SSH_PORT }} deploy@${{ vars.HOST }} smoke $DIGEST failed
