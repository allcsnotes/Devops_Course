# ci.yml - the final M08-L02 workflow: path/branch/tag filters, lint -> test -> build -> release, pinned actions,
# a composite action, one concurrency group per ref (newer runs cancel older ones), and a timeout on every job.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "hc/**"
      - ".github/**"
  pull_request:
    paths:
      - "hc/**"
      - ".github/**"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  STAGE: workflow   # demo: one name at three levels
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: ./.github/actions/hc-lint
        with:
          path: hc
  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run the hc tests
        run: bash hc/tests/run.sh
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGE: job
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Where am I
        run: |
          echo "commit: ${{ github.sha }}"
          echo "ref:    ${{ github.ref_name }}"
          echo "runner: ${{ runner.os }}"
      - name: Env levels
        env:
          STAGE: step
        run: echo "STAGE=$STAGE"
      - name: Read the version
        id: ver
        working-directory: hc
        run: |
          v=$(bash bin/hc --version | cut -d' ' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Name the package
        run: |
          v=${{ steps.ver.outputs.version }}
          echo "PKG=hc-$v-${GITHUB_SHA::7}.tar.gz" >> "$GITHUB_ENV"
      - name: Package
        run: tar czf "$PKG" hc && ls -l "$PKG"
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Release (a stand-in for now)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: echo "release hc $VERSION from tag ${{ github.ref_name }}"
