# secret-scan.yml (M08-L05): scan the whole repository for secrets on every push and pull request.
# Copy to .github/workflows/secret-scan.yml. Trivy is pinned by version and digest (Module 7).
name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        uses: docker://aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
        with:
          args: fs -q --scanners secret --exit-code 1 .
