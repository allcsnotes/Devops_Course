name: secrets-demo
# DEMO ONLY (M08-L05): what log masking catches, and what the job token may do.
# DEMO_API_KEY holds a FAKE value. Never print a real secret, in any form.
on: [workflow_dispatch, pull_request]
permissions:
  contents: read
jobs:
  masking:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.DEMO_API_KEY }}
    steps:
      - name: Is the secret here?
        run: echo "event ${{ github.event_name }}, DEMO_API_KEY set ${{ secrets.DEMO_API_KEY != '' }}"
      - name: What the masker catches
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "as is:      $KEY"
          echo "base64:     $(printf %s "$KEY" | base64)"
          echo "upper case: ${KEY^^}"
          echo "hex:        $(printf %s "$KEY" | od -An -tx1 | tr -d ' \n')"
      - name: Register a derived value
        if: github.event_name == 'workflow_dispatch'
        run: |
          UP="${KEY^^}"
          echo "::add-mask::$UP"
          echo "upper case: $UP"
  token:
    runs-on: ubuntu-latest
    steps:
      - name: What may the job token do?
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
        run: |
          curl -s -o /dev/null -w "read the repository: HTTP %{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" "$API"
          curl -s -o /dev/null -w "write a file:        HTTP %{http_code}\n" -X PUT \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "$API/contents/token-test.txt" -d '{"content":"dGVzdA==","message":"token test"}'
