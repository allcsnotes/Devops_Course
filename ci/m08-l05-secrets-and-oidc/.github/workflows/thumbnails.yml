# thumbnails.yml (M08-L05): the AWS key now comes from repository secrets (encrypted, masked in logs).
# set -x is left in ON PURPOSE to show the masking. Never keep set -x near secrets in real pipelines.
name: thumbnails
on:
  push:
    branches: [main]
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      # repository secrets: encrypted on the server, masked in logs
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        run: |
          set -x
          mkdir -p ~/.aws
          printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
