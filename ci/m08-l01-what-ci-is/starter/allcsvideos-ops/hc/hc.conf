# /etc/hc/hc.conf: settings for hc on this server.
# KEY=value, no spaces around =, no quotes. Read as data, never run.
DISK_WARN=75
DISK_CRIT=90
INODE_WARN=80
INODE_CRIT=90
# memory: alert when this percent or less is still available
MEM_WARN=15
MEM_CRIT=10
# the 1-minute load average, divided by the number of CPUs
LOAD_WARN=2
LOAD_CRIT=3
MOUNTS=/ /data
SERVICES=nginx allcsvideos-api course-copilot redis
ENDPOINTS=storefront=https://localhost/ api=http://localhost:8080/health copilot=http://localhost:8000/health
HTTP_TIMEOUT=5
CERT_DAYS=14
CERT_HOSTS=allcsvideos.com api.allcsvideos.com
# a real chat webhook URL is a secret: keep this file mode 640
WEBHOOK_URL=https://alerts.internal/hooks/hc
NOTIFY_V2=off
